# picom.conf — blur SOLO para el powermenu (ventana tipo "splash").
# Awesome lo lanza con:  picom --config ~/.config/awesome/assets/picom/picom.conf
# Es el mismo criterio del repo de AlphaTechnolog: blur-background-exclude deja fuera todo lo que
# NO sea splash, así la barra, el dashboard y las ventanas no se desenfocan.

# El blur necesita glx (con xrender no hay desenfoque). Si en tu Termux:X11 picom no arranca,
# mirá  ~/.cache/picom.log  y probá  backend = "egl";
backend = "glx";
vsync = false;

blur-method = "dual_kawase";
blur-strength = 7;          # subí este número (1-10) para más borroso
blur-background = true;
blur-background-fixed = true;
blur-background-exclude = [
  "window_type != 'splash'"
];

shadow = false;
fading = false;
